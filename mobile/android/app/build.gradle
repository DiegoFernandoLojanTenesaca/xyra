plugins {
    id 'com.android.application'
}

android {
    namespace 'com.indagalab.xyra'
    compileSdk 34

    defaultConfig {
        applicationId 'com.indagalab.xyra'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '0.4.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.android.gms:play-services-code-scanner:16.1.0'
}
