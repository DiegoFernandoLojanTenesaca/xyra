[package]
name = "xyra-mobile"
version = "0.4.0"
description = "Xyra on your phone: follows the Xyra app of your PC"
edition = "2024"
license = "MIT"
authors = ["Xynitra · IndagaLab"]

[lib]
name = "xyra_mobile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
