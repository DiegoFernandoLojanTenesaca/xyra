<!doctype html>
<html lang="__LANG__">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#060606" />
    <title>Xyra</title>
    <style>
      :root {
        font: var(--text-lg) / 1.45 var(--font-family);
        color: var(--color-text);
        background: var(--color-background);
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: var(--space-4) var(--space-4) var(--space-8);
      }
      header {
        display: flex;
        align-items: center;
        gap: var(--space-2);
        margin-bottom: var(--space-4);
        font-weight: 700;
        letter-spacing: var(--tracking-wide);
      }
      header svg {
        width: var(--size-thumb);
        height: var(--size-thumb);
      }
      .phase {
        margin-left: auto;
        padding: var(--space-1) var(--space-2);
        border: var(--border-hairline) solid var(--color-line);
        color: var(--color-textMuted);
        font-size: var(--text-xs);
        text-transform: uppercase;
      }
      .phase.live {
        border-color: var(--color-accent);
        color: var(--color-accentBright);
      }
      section {
        margin-bottom: var(--space-4);
        padding: var(--space-4);
        border: var(--border-hairline) solid var(--color-line);
        background: var(--color-panel);
      }
      h2 {
        margin: 0 0 var(--space-3);
        color: var(--color-textMuted);
        font-size: var(--text-sm);
        letter-spacing: var(--tracking-wide);
        text-transform: uppercase;
      }
      .row {
        display: flex;
        align-items: center;
        gap: var(--space-3);
        padding: var(--space-2) 0;
      }
      .row + .row {
        border-top: var(--border-hairline) solid var(--color-line);
      }
      .row img {
        width: var(--size-thumb);
        height: var(--size-thumb);
        flex: none;
      }
      .grow {
        flex: 1;
        min-width: 0;
      }
      .muted {
        color: var(--color-textMuted);
      }
      .good {
        color: var(--color-success);
      }
      .accent {
        color: var(--color-accentBright);
      }
      .big {
        font-size: var(--text-xl);
        font-weight: 700;
      }
      button {
        width: 100%;
        margin-top: var(--space-2);
        padding: var(--space-3);
        border: var(--border-hairline) solid var(--color-lineStrong);
        background: var(--color-panelRaised);
        color: var(--color-text);
        font: inherit;
        font-weight: 700;
        letter-spacing: var(--tracking-wide);
        text-transform: uppercase;
      }
      button.primary {
        border-color: var(--color-accent);
        background: var(--color-accent);
        color: var(--color-white);
      }
      button.huge {
        padding: var(--space-6);
        font-size: var(--text-xl);
      }
      button:disabled {
        opacity: 0.5;
      }
      .buttons {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: var(--space-2);
      }
      .key {
        display: grid;
        place-items: center;
        width: var(--size-thumb);
        height: var(--size-thumb);
        flex: none;
        background: var(--color-accent);
        color: var(--color-white);
        font-weight: 700;
      }
      .card.best {
        color: var(--color-accentBright);
        font-weight: 700;
      }
      .notice {
        margin: 0 0 var(--space-4);
        padding: var(--space-3);
        border-left: var(--border-accent) solid var(--color-accent);
        background: var(--color-panel);
      }
    </style>
  </head>
  <body>
    <header>
      <svg viewBox="0 0 256 256" aria-hidden="true">
        <polygon fill="#e5132b" points="128,20 176,68 128,116 80,68" />
        <polygon fill="#e5132b" points="68,80 116,128 68,176 20,128" />
        <polygon fill="#e5132b" points="188,80 236,128 188,176 140,128" />
        <polygon fill="#e5132b" points="128,140 176,188 128,236 80,188" />
        <polygon fill="#8a8e97" points="128,92 164,128 128,164 92,128" />
      </svg>
      XYRA
      <span class="phase" id="phase"></span>
    </header>
    <p class="notice" id="notice" hidden></p>
    <main id="app"></main>

    <script>
      const TEXTS = "__TEXTS__";
      const TOKENS = "__TOKENS__";
      const RETRY_MS = 3000;
      const COUNTERS_SHOWN = 3;
      const TOKEN_KEY = 'xyra-token';
      const LIVE_PHASES = ['champSelect', 'inGame'];

      const walk = (node, prefix) =>
        Object.entries(node).forEach(([key, value]) =>
          typeof value === 'string'
            ? document.documentElement.style.setProperty(`--${prefix}${key}`, value.replace(/^\{(.+)\}$/, (_, alias) => `var(--${alias.replaceAll('.', '-')})`))
            : walk(value, `${prefix}${key}-`),
        );
      walk(TOKENS, '');

      const params = new URLSearchParams(location.search);
      if (params.get('t')) localStorage.setItem(TOKEN_KEY, params.get('t'));
      const token = localStorage.getItem(TOKEN_KEY);
      history.replaceState(null, '', '/');

      const numbers = new Intl.NumberFormat(document.documentElement.lang);
      const percents = new Intl.NumberFormat(document.documentElement.lang, { style: 'percent', maximumFractionDigits: 1 });
      const escape = (text) => String(text ?? '').replace(/[&<>"']/g, (c) => `&#${c.charCodeAt(0)};`);
      const t = (key, values = {}) =>
        String(key.split('.').reduce((node, part) => node?.[part], TEXTS) ?? key).replace(/\{\{(\w+)\}\}/g, (_, name) => values[name] ?? '');
      const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

      let state = null;
      let stats = null;
      let offline = false;
      let busy = false;

      async function api(path, options) {
        const response = await fetch(`${path}${path.includes('?') ? '&' : '?'}t=${encodeURIComponent(token)}`, options);
        if (response.status === 403) throw new Error('forbidden');
        return response.json();
      }

      function say(text) {
        const notice = document.getElementById('notice');
        notice.textContent = text;
        notice.hidden = !text;
      }

      async function act(path) {
        busy = true;
        render();
        try {
          const result = await api(path, { method: 'POST' });
          say(result.ok ? t('done') : t(`errors.${result.error?.code}`, { detail: result.error?.detail ?? '' }));
        } catch {
          say(t('offline'));
        }
        busy = false;
        render();
      }

      const champion = (asset, detail = '') =>
        `<div class="row">${asset.icon ? `<img src="${escape(asset.icon)}" alt="" />` : ''}<span class="grow">${escape(asset.name)}</span>${detail}</div>`;

      function champSelect(select) {
        const mine = select.champion;
        const parts = [];
        if (mine) {
          parts.push(`<section><h2>${t('yourChampion')}</h2>${champion(mine)}
            <div class="buttons">
              ${['runes', 'items', 'spells'].map((target) => `<button data-post="/api/import?target=${target}" ${busy ? 'disabled' : ''}>${t(`import.${target}`)}</button>`).join('')}
            </div></section>`);
        }
        if (select.bench_pick) parts.push(`<section><h2>${t('bench')}</h2>${champion(select.bench_pick, `<b class="accent">#${select.bench_pick.rank ?? ''}</b>`)}</section>`);
        if (select.lane_opponent && select.counter_picks.length) {
          parts.push(`<section><h2>${t('counters', { enemy: escape(select.lane_opponent.name) })}</h2>
            ${select.counter_picks
              .slice(0, COUNTERS_SHOWN)
              .map((pick) => champion(pick.champion, `<b class="good">${percents.format(pick.win_rate / 100)}</b>`))
              .join('')}</section>`);
        }
        return parts.join('');
      }

      function inGame() {
        const parts = [];
        const tips = state.tips;
        if (tips) {
          const next = tips.next_item;
          const gold = next?.missing === null || next?.missing === undefined ? t('nextItem') : next.missing === 0 ? t('canBuy') : t('goldMissing', { gold: numbers.format(next.missing) });
          parts.push(`<section><h2>${t('tips')}</h2>
            <div class="row"><span class="key">${escape(tips.skill ?? '—')}</span><span class="grow">${tips.skill ? t('levelSkill', { skill: escape(tips.skill) }) : t('noSkillPoint')}</span></div>
            ${next ? champion(next.item, `<small class="${next.missing === 0 ? 'good' : 'muted'}">${gold}</small>`) : ''}</section>`);
        }
        const cards = [...state.cards].sort((a, b) => a.x - b.x);
        if (cards.length) {
          parts.push(`<section><h2>${t('cards')}</h2>
            ${cards.map((card) => `<div class="row card ${card.best ? 'best' : ''}"><img src="${escape(card.icon)}" alt="" /><span class="grow">${escape(card.name)}</span><b>${escape(card.grade)}</b></div>`).join('')}</section>`);
        }
        return parts.join('') || `<section class="muted">${t('playing')}</section>`;
      }

      function idle() {
        const summary = stats && stats.games ? `<div class="row"><span class="grow">${t('games', { count: numbers.format(stats.games) })}</span><b class="accent">${t('winRate', { value: percents.format(stats.wins / stats.games) })}</b></div>` : '';
        return `<section><p class="muted">${t('idle')}</p>${summary}</section>`;
      }

      function render() {
        const phase = document.getElementById('phase');
        const app = document.getElementById('app');
        if (!token) {
          app.innerHTML = `<section>${t('noToken')}</section>`;
          return;
        }
        if (offline || !state) {
          phase.textContent = '';
          app.innerHTML = `<section class="muted">${offline ? t('offline') : t('connecting')}</section>`;
          return;
        }
        phase.textContent = t(`phases.${state.phase}`);
        phase.classList.toggle('live', LIVE_PHASES.includes(state.phase));
        const accept = state.ready_check
          ? `<section><h2>${t('matchFound')}</h2><button class="primary huge" data-post="/api/accept" ${busy ? 'disabled' : ''}>${t('accept')}</button></section>`
          : '';
        const body = state.champ_select ? champSelect(state.champ_select) : state.phase === 'inGame' ? inGame() : idle();
        app.innerHTML = accept + body;
      }

      document.addEventListener('click', (event) => {
        const button = event.target.closest('button[data-post]');
        if (button) act(button.dataset.post);
      });

      async function follow() {
        let version = null;
        while (token) {
          try {
            const answer = await api(`/api/state${version === null ? '' : `?after=${version}`}`);
            if (answer.state.phase !== state?.phase && !answer.state.champ_select && answer.state.phase !== 'inGame') stats = await api('/api/stats');
            ({ version, state } = answer);
            offline = false;
          } catch (error) {
            if (error.message === 'forbidden' && window.XyraApp) return window.XyraApp.scan();
            offline = true;
            version = null;
            await sleep(RETRY_MS);
          }
          render();
        }
      }

      render();
      follow();
    </script>
  </body>
</html>
