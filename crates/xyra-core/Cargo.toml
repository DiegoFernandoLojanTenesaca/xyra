[package]
name = "xyra-core"
description = "Platform-independent Xyra logic: cards, OP.GG, League client, stats and configuration"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[build-dependencies]
serde_json = "1"

[dependencies]
base64 = "0.22"
include_dir = "0.7"
ring = "0.17"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
strsim = "0.11"
ts-rs = { version = "12", features = ["no-serde-warnings"] }
tungstenite = "0.30"
unicode-normalization = "0.1"
