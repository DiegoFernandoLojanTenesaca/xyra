# Espacio de trabajo: la lógica compartida (xyra-core) separada de la app de Windows (src-tauri),
# para poder reutilizarla más adelante (por ejemplo, un compañero en el celular).
[workspace]
resolver = "2"
members = ["crates/xyra-core", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Xynitra · IndagaLab"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
