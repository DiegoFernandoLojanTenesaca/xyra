[workspace]
resolver = "3"
members = ["crates/xyra-core", "src-tauri"]
exclude = ["mobile/src-tauri"]

[workspace.package]
version = "1.0.0"
edition = "2024"
license = "MIT"
authors = ["Xynitra · IndagaLab"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
