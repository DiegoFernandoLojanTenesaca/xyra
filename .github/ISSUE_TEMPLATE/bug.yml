name: Reportar un fallo / Bug report
description: Algo no funciona como esperabas / Something is not working
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: Qué pasó / What happened
      description: Por ejemplo "no salieron las etiquetas", "la etiqueta sale corrida", "calificó mal una carta".
    validations:
      required: true
  - type: input
    id: resolution
    attributes:
      label: Resolución de pantalla y escala de Windows / Screen resolution and scaling
      placeholder: 1920x1080, 125 %
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Modo / Mode
      options: [ARAM Caos / Mayhem, Arena]
    validations:
      required: true
  - type: dropdown
    id: window
    attributes:
      label: Modo de ventana del LoL / League window mode
      options: [Sin bordes / Borderless, Pantalla completa / Fullscreen, Ventana / Windowed]
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Registro / Log
      description: Ajustes → General → Abrir registro / Settings → General → Open log. Pega las últimas líneas (xyra.log).
      render: text
  - type: textarea
    id: screenshot
    attributes:
      label: Captura / Screenshot
      description: Activa "Guardar capturas al detectar cartas" en Ajustes y adjunta la imagen (recorta nombres de otros jugadores) / Turn on "Save screenshots" in Settings and attach the image (crop other players' names).
