name: Release

on:
  push:
    tags: ['*.*.*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: swatinem/rust-cache@v2

      - name: Check the tag matches the app version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          [ "$version" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME does not match version $version in Cargo.toml"; exit 1; }

      - name: Check
        run: |
          pnpm install --frozen-lockfile
          pnpm lint
          pnpm check
          cargo fmt --all --check
          pnpm build
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace
          git diff --exit-code src/lib/generated

      - name: Build the installer
        run: |
          pnpm tauri build
          mv target/release/bundle/nsis/*.exe "xyra-${GITHUB_REF_NAME}.exe"

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          body_path: CHANGELOG.md

      - name: Upload the installer
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in 1 2 3; do
            gh release upload "$GITHUB_REF_NAME" "xyra-${GITHUB_REF_NAME}.exe" --clobber && break
            [ "$attempt" = 3 ] && exit 1
            sleep 20
          done
